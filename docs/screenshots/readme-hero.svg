<svg width="2400" height="800" viewBox="0 0 2400 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Notion-As-Blog hero preview</title>
  <desc id="desc">A polished product banner showing a Notion CMS database flowing into a dark mode Next.js blog on desktop and mobile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="0.43" stop-color="#f8f1ec"/>
      <stop offset="0.62" stop-color="#dfeffc"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 265) rotate(90) scale(260 360)">
      <stop stop-color="#ff6b81" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6b81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1290 260) rotate(90) scale(310 520)">
      <stop stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="1350" y1="120" x2="1750" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35b7e8"/>
      <stop offset="0.35" stop-color="#174363"/>
      <stop offset="0.7" stop-color="#d4c6af"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#ffffff" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="2400" height="800" fill="url(#bg)"/>
  <rect x="780" y="0" width="660" height="800" fill="url(#dots)" opacity="0.72"/>
  <rect x="660" y="0" width="740" height="650" fill="url(#glowPink)"/>
